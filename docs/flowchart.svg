<svg xmlns="http://www.w3.org/2000/svg" width="680" height="770" viewBox="0 0 680 770" role="img" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title>How a job flows through Claude and the DeepSeek workers</title>
<desc>You ask Claude. Claude plans and keeps working, and sends parts of the job to a web searcher, a reader, a coder working in its own copy, or a DeepSeek lead whose own team of readers, web searchers and coders reports to it. Everything comes back to Claude, which checks reports, code changes and web claims, merges accepted changes into your files, runs all the tests, and answers you.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
<style>
.gray{fill:#F1EFE8;stroke:#5F5E5A}.gray-t{fill:#444441}.gray-s{fill:#5F5E5A}
.purple{fill:#EEEDFE;stroke:#534AB7}.purple-t{fill:#3C3489}.purple-s{fill:#534AB7}
.teal{fill:#E1F5EE;stroke:#0F6E56}.teal-t{fill:#085041}.teal-s{fill:#0F6E56}
.coral{fill:#FAECE7;stroke:#993C1D}.coral-t{fill:#712B13}.coral-s{fill:#993C1D}
rect{stroke-width:1}.t{font-size:14px;font-weight:500}.s{font-size:12px}
.arr{stroke:#5F5E5A;stroke-width:1.5;fill:none}
</style>
</defs>
<rect x="0" y="0" width="680" height="770" rx="12" fill="#FFFFFF"/>
<rect class="gray" x="260" y="40" width="160" height="52" rx="4"/><text class="t gray-t" x="340" y="61" text-anchor="middle">You ask</text><text class="s gray-s" x="340" y="80" text-anchor="middle">in plain words</text>
<line class="arr" x1="340" y1="92" x2="340" y2="126" marker-end="url(#arrow)"/>
<rect class="purple" x="190" y="130" width="300" height="56" rx="4"/><text class="t purple-t" x="340" y="153" text-anchor="middle">Claude plans</text><text class="s purple-s" x="340" y="173" text-anchor="middle">splits the job, keeps working</text>
<path class="arr" d="M340 186 L340 212 L92 212 L92 236" marker-end="url(#arrow)"/>
<path class="arr" d="M217 212 L217 236" marker-end="url(#arrow)"/>
<path class="arr" d="M342 212 L342 236" marker-end="url(#arrow)"/>
<path class="arr" d="M340 212 L535 212 L535 236" marker-end="url(#arrow)"/>
<rect class="teal" x="40" y="240" width="105" height="64" rx="4"/><text class="t teal-t" x="92" y="265" text-anchor="middle">Web searcher</text><text class="s teal-s" x="92" y="285" text-anchor="middle">outside info</text>
<rect class="teal" x="165" y="240" width="105" height="64" rx="4"/><text class="t teal-t" x="217" y="265" text-anchor="middle">Reader</text><text class="s teal-s" x="217" y="285" text-anchor="middle">read, review</text>
<rect class="coral" x="290" y="240" width="105" height="64" rx="4"/><text class="t coral-t" x="342" y="265" text-anchor="middle">Coder</text><text class="s coral-s" x="342" y="285" text-anchor="middle">in its own copy</text>
<rect class="teal" x="430" y="240" width="210" height="64" rx="4"/><text class="t teal-t" x="535" y="265" text-anchor="middle">DeepSeek lead</text><text class="s teal-s" x="535" y="285" text-anchor="middle">big job, splits it up</text>
<line class="arr" x1="535" y1="304" x2="535" y2="332" marker-end="url(#arrow)"/>
<rect x="430" y="336" width="210" height="96" rx="4" fill="none" stroke="#888780" stroke-dasharray="4 3"/>
<text class="s gray-s" x="535" y="354" text-anchor="middle">Lead's team (reports to the lead)</text>
<rect class="teal" x="436" y="362" width="62" height="62" rx="4"/><text class="t teal-t" x="467" y="388" text-anchor="middle">Reader</text><text class="s teal-s" x="467" y="408" text-anchor="middle">reads</text>
<rect class="teal" x="504" y="362" width="62" height="62" rx="4"/><text class="t teal-t" x="535" y="388" text-anchor="middle">Web</text><text class="s teal-s" x="535" y="408" text-anchor="middle">searches</text>
<rect class="coral" x="572" y="362" width="62" height="62" rx="4"/><text class="t coral-t" x="603" y="388" text-anchor="middle">Coder</text><text class="s coral-s" x="603" y="408" text-anchor="middle">codes</text>
<line class="arr" x1="535" y1="432" x2="535" y2="466" marker-end="url(#arrow)"/>
<line class="arr" x1="92" y1="304" x2="92" y2="466" marker-end="url(#arrow)"/>
<line class="arr" x1="217" y1="304" x2="217" y2="466" marker-end="url(#arrow)"/>
<line class="arr" x1="342" y1="304" x2="342" y2="466" marker-end="url(#arrow)"/>
<rect class="purple" x="40" y="470" width="600" height="56" rx="4"/><text class="t purple-t" x="340" y="493" text-anchor="middle">Claude checks everything</text><text class="s purple-s" x="340" y="513" text-anchor="middle">reports, code changes, web claims</text>
<line class="arr" x1="340" y1="526" x2="340" y2="556" marker-end="url(#arrow)"/>
<rect class="purple" x="190" y="560" width="300" height="56" rx="4"/><text class="t purple-t" x="340" y="583" text-anchor="middle">Claude merges into your files</text><text class="s purple-s" x="340" y="603" text-anchor="middle">then runs all the tests</text>
<line class="arr" x1="340" y1="616" x2="340" y2="648" marker-end="url(#arrow)"/>
<rect class="gray" x="260" y="652" width="160" height="52" rx="4"/><text class="t gray-t" x="340" y="673" text-anchor="middle">Answer to you</text><text class="s gray-s" x="340" y="692" text-anchor="middle">with what changed</text>
<rect class="purple" x="40" y="730" width="14" height="14" rx="2"/><text class="s gray-t" x="62" y="742">Claude</text>
<rect class="teal" x="130" y="730" width="14" height="14" rx="2"/><text class="s gray-t" x="152" y="742">DeepSeek, can't touch your files</text>
<rect class="coral" x="390" y="730" width="14" height="14" rx="2"/><text class="s gray-t" x="412" y="742">DeepSeek, edits only its own copy</text>
</svg>
